[project]
name = "wiki_pdf"
authors = [
    { name = "Mercy Selvanayagi", email = "mercy.selvanayagi@azimpremjifoundation.org"}
]
description = "Custom App for Wiki PDF Download"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "groq>=1.5.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
